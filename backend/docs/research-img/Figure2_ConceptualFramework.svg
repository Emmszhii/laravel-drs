<svg viewBox="0 0 1600 910" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="1600" height="910" fill="#ffffff"/>

  <text x="800" y="65" text-anchor="middle" font-size="46" font-weight="bold" fill="#1a1a1a">Conceptual Framework of DisasterResource+ (IPO Model)</text>

  <!-- INPUT box -->
  <rect x="50" y="130" width="460" height="730" rx="18" fill="#dbe7fb" stroke="#3b6fd6" stroke-width="2.5"/>
  <text x="280" y="195" text-anchor="middle" font-size="44" font-weight="bold" fill="#1a1a1a">INPUT</text>
  <line x1="95" y1="225" x2="505" y2="225" stroke="#3b6fd6" stroke-width="1.5"/>

  <text x="90" y="290" font-size="38" fill="#1a1a1a">• Zone-level</text>
  <text x="110" y="334" font-size="38" fill="#1a1a1a">demand data</text>

  <text x="90" y="410" font-size="38" fill="#1a1a1a">• Depot-level</text>
  <text x="110" y="454" font-size="38" fill="#1a1a1a">supply data</text>

  <text x="90" y="530" font-size="38" fill="#1a1a1a">• Road network data</text>

  <rect x="85" y="590" width="390" height="200" rx="12" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="280" y="655" text-anchor="middle" font-size="38" fill="#1a1a1a">Logged online, or</text>
  <text x="280" y="700" text-anchor="middle" font-size="38" fill="#1a1a1a">queued offline via</text>
  <text x="280" y="745" text-anchor="middle" font-size="38" fill="#1a1a1a">PWA / IndexedDB</text>

  <!-- Arrow Input -> Process -->
  <line x1="510" y1="495" x2="530" y2="495" stroke="#1a1a1a" stroke-width="4"/>
  <polygon points="530,477 570,495 530,513" fill="#1a1a1a"/>

  <!-- PROCESS box -->
  <rect x="570" y="130" width="460" height="730" rx="18" fill="#d9f2e3" stroke="#2f9e5c" stroke-width="2.5"/>
  <text x="800" y="195" text-anchor="middle" font-size="44" font-weight="bold" fill="#1a1a1a">PROCESS</text>
  <line x1="615" y1="225" x2="985" y2="225" stroke="#2f9e5c" stroke-width="1.5"/>
  <text x="800" y="280" text-anchor="middle" font-size="38" font-weight="bold" fill="#1a1a1a">Solver-Service</text>

  <rect x="600" y="315" width="400" height="300" rx="12" fill="#ffffff" stroke="#2f9e5c" stroke-width="1.5"/>
  <text x="800" y="365" text-anchor="middle" font-size="38" font-weight="bold" fill="#1a1a1a">PuLP Linear</text>
  <text x="800" y="409" text-anchor="middle" font-size="38" font-weight="bold" fill="#1a1a1a">Programming</text>
  <text x="800" y="453" text-anchor="middle" font-size="38" font-weight="bold" fill="#1a1a1a">Allocation</text>
  <text x="800" y="497" text-anchor="middle" font-size="38" font-weight="bold" fill="#1a1a1a">Solver +</text>
  <text x="800" y="541" text-anchor="middle" font-size="38" font-weight="bold" fill="#1a1a1a">Heuristic</text>
  <text x="800" y="585" text-anchor="middle" font-size="38" font-weight="bold" fill="#1a1a1a">Tie-Breaking</text>

  <text x="800" y="662" text-anchor="middle" font-size="36" font-weight="bold" fill="#1a1a1a">+</text>

  <rect x="600" y="685" width="400" height="150" rx="12" fill="#ffffff" stroke="#2f9e5c" stroke-width="1.5"/>
  <text x="800" y="740" text-anchor="middle" font-size="38" font-weight="bold" fill="#1a1a1a">OSRM Routing</text>
  <text x="800" y="784" text-anchor="middle" font-size="38" font-weight="bold" fill="#1a1a1a">Engine</text>

  <!-- Arrow Process -> Output -->
  <line x1="1030" y1="495" x2="1050" y2="495" stroke="#1a1a1a" stroke-width="4"/>
  <polygon points="1050,477 1090,495 1050,513" fill="#1a1a1a"/>

  <!-- OUTPUT box -->
  <rect x="1090" y="130" width="460" height="730" rx="18" fill="#fbe6d0" stroke="#e08a2c" stroke-width="2.5"/>
  <text x="1320" y="195" text-anchor="middle" font-size="44" font-weight="bold" fill="#1a1a1a">OUTPUT</text>
  <line x1="1135" y1="225" x2="1505" y2="225" stroke="#e08a2c" stroke-width="1.5"/>

  <text x="1130" y="310" font-size="38" fill="#1a1a1a">• Suggested resource</text>
  <text x="1130" y="354" font-size="38" fill="#1a1a1a">  allocation</text>

  <text x="1130" y="480" font-size="38" fill="#1a1a1a">• Real-time Web-GIS</text>
  <text x="1130" y="524" font-size="38" fill="#1a1a1a">  dashboard</text>

  <text x="1130" y="650" font-size="38" fill="#1a1a1a">• Synchronized field</text>
  <text x="1130" y="694" font-size="38" fill="#1a1a1a">  data log</text>
</svg>
