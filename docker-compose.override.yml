# Local-development-only overrides, auto-merged by plain `docker compose` commands.
#
# Coolify deploys this app with an explicit `-f docker-compose.yml` (see its
# deploy logs), so it never picks up this file — these host-port publishes
# stay purely a local convenience and never collide with the previous
# deployment's still-running containers during a Coolify rollout (see
# docker-compose.yml's backend/reverb/solver-service/osrm comments for why
# those lost their `ports:` entries).
#
# The `volumes:` bind mounts below (backend/queue/scheduler/reverb/
# solver-service) are the same story: locally they're a live-edit convenience
# (no rebuild needed to see code changes), but in Coolify they'd bind-mount an
# empty ephemeral artifact-directory path over the image's baked-in code,
# wiping out `artisan`/`vendor`/`main.py` entirely (see docker-compose.yml's
# backend service comment, and git history for the resulting
# "Could not open input file: artisan" crash-loop investigation).
#
# The top-level `networks: coolify:` override below neutralizes
# docker-compose.yml's `external: true` (Compose merges named-network
# definitions field-by-field) — locally this becomes an ordinary
# project-scoped network Compose creates itself, so `docker compose up`
# doesn't require a pre-existing `coolify` network on the dev machine.
#
# `postgres` itself is defined ENTIRELY here, not in docker-compose.yml —
# production already points DB_HOST at a separate, standalone PostgreSQL
# resource created directly in the Coolify project (not this compose stack),
# so a bundled postgres service in the base file would be redundant dead
# weight there. Locally, this is the only place a database gets stood up,
# so backend/queue/scheduler/reverb's `depends_on: postgres:` entries below
# are added here too — Compose merges these additively with each service's
# base-file `depends_on` (e.g. `backend` ends up depending on both `postgres`
# and `solver-service` locally, but only `solver-service` under Coolify).
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: disasterresource-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: disasterresource
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-postgis.sh:/docker-entrypoint-initdb.d/init-postgis.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

  queue:
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

  reverb:
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

  solver-service:
    ports:
      - "8001:8001"
    volumes:
      - ./solver-service:/app

  osrm:
    ports:
      - "5001:5000"
    volumes:
      - ./docker/osrm/data:/data:ro

networks:
  coolify:
    external: false

volumes:
  pgdata:
