services:
  # No `ports:` here on purpose — only reached over the internal Docker
  # network (DB_HOST=postgres). A statically published host port would
  # collide with the previous deployment's still-running postgres container
  # during a Coolify rollout (two containers can't bind the same host port).
  # Local dev gets `localhost:5432` back via docker-compose.override.yml,
  # which Coolify's `-f docker-compose.yml`-only invocation never loads.
  postgres:
    image: postgis/postgis:16-3.4
    container_name: disasterresource-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: disasterresource
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-postgis.sh:/docker-entrypoint-initdb.d/init-postgis.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Shared across backend/queue/scheduler/reverb (identical build context +
    # Dockerfile, just different `command:`) so Compose builds this image
    # once and reuses it for the other three, instead of rebuilding the same
    # heavy Dockerfile (compiles pcntl/pdo_pgsql from source) 4 separate
    # times on every deploy.
    image: laravel-drs-backend:latest
    container_name: disasterresource-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      solver-service:
        condition: service_healthy
    ports:
      - "8000:8000"   # Laravel (web/api)
    volumes:
      - ./backend:/var/www/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 25s

  # Runs App\Jobs\RunOptimizationJob (QUEUE_CONNECTION=database) — without
  # this nothing ever processes the queued optimization calls.
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # See the `backend` service's comment — shares the same built image.
    image: laravel-drs-backend:latest
    container_name: disasterresource-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --backoff=15
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
    stop_grace_period: 90s
    healthcheck:
      # Disables the base FrankenPHP image's default HEALTHCHECK, which
      # probes FrankenPHP's own admin API — not applicable here since this
      # service runs `php artisan queue:work`, not the FrankenPHP/Caddy server.
      disable: true

  # Runs the Laravel scheduler (routes/console.php): polls the configured
  # disaster feeds (USGS/GDACS) on the admin-set interval and auto-resolves
  # stale incidents. Without this, nothing ever triggers PollDisasterFeedsJob
  # / AutoResolveIncidentsJob — the `queue` service above must also be up
  # since scheduled jobs are dispatched onto the queue, not run inline.
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # See the `backend` service's comment — shares the same built image.
    image: laravel-drs-backend:latest
    container_name: disasterresource-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
    stop_grace_period: 90s
    healthcheck:
      # See the `queue` service's comment — same reasoning applies here.
      disable: true

  # Websocket server for App\Events\DisasterAlertEvent (routes/channels.php).
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # See the `backend` service's comment — shares the same built image.
    image: laravel-drs-backend:latest
    container_name: disasterresource-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"   # Reverb (realtime)
    volumes:
      - ./backend:/var/www/html
    healthcheck:
      # See the `queue` service's comment — same reasoning applies here.
      disable: true

  # No `ports:` here either — see the `postgres` comment above, same reasoning.
  solver-service:
    build:
      context: ./solver-service
      dockerfile: Dockerfile
    container_name: disasterresource-solver
    restart: unless-stopped
    volumes:
      - ./solver-service:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Self-hosted routing engine (free, no API key) for turn-by-turn directions.
  # Requires `docker/osrm/prepare.sh` to have been run at least once — this
  # service does not build/extract OSM data itself, only serves it.
  # No `ports:` here either — see the `postgres` comment above, same reasoning.
  osrm:
    image: osrm/osrm-backend
    container_name: disasterresource-osrm
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/philippines-latest.osrm
    volumes:
      - ./docker/osrm/data:/data:ro

volumes:
  pgdata:
