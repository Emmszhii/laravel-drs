services:
  # `postgres` is NOT defined here — Coolify's `.env.production` already
  # points DB_HOST at a separate, standalone PostgreSQL resource created
  # directly in the Coolify project, so this compose stack's own bundled
  # postgres would be redundant dead weight in production, and it was the
  # thing crash-looping and blocking every Coolify deploy (see git history
  # for the investigation). It's still defined, for local dev only, in
  # docker-compose.override.yml — which Coolify's `-f docker-compose.yml`
  # -only invocation never loads.
  # No `ports:` here on purpose — Coolify's blue-green rollout briefly runs
  # this deployment's containers alongside the previous one's, and a static
  # host-port publish collides between the two (same failure mode postgres/
  # solver-service/osrm hit — see git history). Coolify's own Traefik routes
  # to `backend`/`reverb` over the internal `coolify` Docker network via
  # SERVICE_FQDN_BACKEND/SERVICE_URL_REVERB (see .env.production), so the
  # host port isn't needed for external reachability. Local dev gets
  # `localhost:8000`/`localhost:8080` back via docker-compose.override.yml.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Shared across backend/queue/scheduler/reverb (identical build context +
    # Dockerfile, just different `command:`) so Compose builds this image
    # once and reuses it for the other three, instead of rebuilding the same
    # heavy Dockerfile (compiles pcntl/pdo_pgsql from source) 4 separate
    # times on every deploy.
    image: laravel-drs-backend:latest
    container_name: disasterresource-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      solver-service:
        condition: service_healthy
    # No bind mount here on purpose — Coolify builds from a fresh, ephemeral
    # per-deployment artifact directory (not a persistent checkout of this
    # repo), so bind-mounting `./backend` there shadows the image's baked-in
    # code (from the Dockerfile's `COPY . .` + composer/npm build) with an
    # empty directory, breaking `artisan`/`vendor`/built assets entirely (see
    # git history for the "Could not open input file: artisan" investigation).
    # Production always runs the code baked into the image; a code change
    # means a new image build + Coolify's own blue-green container swap,
    # gated by this service's healthcheck below. Local dev gets the bind
    # mount back via docker-compose.override.yml.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 25s
    networks:
      - default
      - coolify

  # Runs App\Jobs\RunOptimizationJob (QUEUE_CONNECTION=database) — without
  # this nothing ever processes the queued optimization calls.
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # See the `backend` service's comment — shares the same built image.
    image: laravel-drs-backend:latest
    container_name: disasterresource-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --backoff=15
    env_file:
      - .env
    # No bind mount here — see the `backend` service's comment above, same reasoning.
    stop_grace_period: 90s
    healthcheck:
      # Disables the base FrankenPHP image's default HEALTHCHECK, which
      # probes FrankenPHP's own admin API — not applicable here since this
      # service runs `php artisan queue:work`, not the FrankenPHP/Caddy server.
      disable: true
    networks:
      - default
      - coolify

  # Runs the Laravel scheduler (routes/console.php): polls the configured
  # disaster feeds (USGS/GDACS) on the admin-set interval and auto-resolves
  # stale incidents. Without this, nothing ever triggers PollDisasterFeedsJob
  # / AutoResolveIncidentsJob — the `queue` service above must also be up
  # since scheduled jobs are dispatched onto the queue, not run inline.
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # See the `backend` service's comment — shares the same built image.
    image: laravel-drs-backend:latest
    container_name: disasterresource-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env
    # No bind mount here — see the `backend` service's comment above, same reasoning.
    stop_grace_period: 90s
    healthcheck:
      # See the `queue` service's comment — same reasoning applies here.
      disable: true
    networks:
      - default
      - coolify

  # Websocket server for App\Events\DisasterAlertEvent (routes/channels.php).
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # See the `backend` service's comment — shares the same built image.
    image: laravel-drs-backend:latest
    container_name: disasterresource-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file:
      - .env
    # No bind mount here — see the `backend` service's comment above, same reasoning.
    healthcheck:
      # See the `queue` service's comment — same reasoning applies here.
      disable: true
    networks:
      - default
      - coolify

  # No `ports:` here either — see the `postgres` comment above, same reasoning.
  solver-service:
    build:
      context: ./solver-service
      dockerfile: Dockerfile
    container_name: disasterresource-solver
    restart: unless-stopped
    # No bind mount here — same reasoning as the `backend` service's comment
    # above: production runs the image's baked-in code (Dockerfile's
    # `COPY . .`), not a bind-mounted ephemeral artifact path.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - default
      - coolify

  # Self-hosted routing engine (free, no API key) for turn-by-turn directions.
  # Requires `docker/osrm/prepare.sh` to have been run at least once — this
  # service does not build/extract OSM data itself, only serves it.
  # No `ports:` here either — see the `postgres` comment above, same reasoning.
  osrm:
    image: osrm/osrm-backend
    container_name: disasterresource-osrm
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/philippines-latest.osrm
    volumes:
      - ./docker/osrm/data:/data:ro
    networks:
      - default
      - coolify

# Coolify's shared network — needed to resolve other Coolify-managed
# resources by container hostname (e.g. the standalone PostgreSQL resource
# `.env.production`'s DB_HOST points at) and for Coolify's Traefik instance
# to route to `backend`/`reverb`, which publish no host ports of their own.
# `external: true` because Coolify owns/creates this network, not this
# compose project. Local dev neutralizes this in docker-compose.override.yml
# (external: false) so it doesn't require a pre-existing `coolify` network.
networks:
  coolify:
    external: true
