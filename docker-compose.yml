services:
  # `postgres` is NOT defined here — Coolify's `.env.production` already
  # points DB_HOST at a separate, standalone PostgreSQL resource created
  # directly in the Coolify project, so this compose stack's own bundled
  # postgres would be redundant dead weight in production, and it was the
  # thing crash-looping and blocking every Coolify deploy (see git history
  # for the investigation). It's still defined, for local dev only, in
  # docker-compose.override.yml — which Coolify's `-f docker-compose.yml`
  # -only invocation never loads.
  # No `ports:` here on purpose — Coolify's blue-green rollout briefly runs
  # this deployment's containers alongside the previous one's, and a static
  # host-port publish collides between the two (same failure mode postgres/
  # solver-service hit — see git history). Coolify's own Traefik routes
  # to `backend`/`reverb` over the internal `coolify` Docker network via
  # SERVICE_FQDN_BACKEND/SERVICE_URL_REVERB (see .env.production), so the
  # host port isn't needed for external reachability. Local dev gets
  # `localhost:8000`/`localhost:8080` back via docker-compose.override.yml.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Shared across backend/queue/scheduler/reverb (identical build context +
    # Dockerfile, just different `command:`) so Compose builds this image
    # once and reuses it for the other three, instead of rebuilding the same
    # heavy Dockerfile (compiles pcntl/pdo_pgsql from source) 4 separate
    # times on every deploy.
    image: laravel-drs-backend:latest
    container_name: disasterresource-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      solver-service:
        condition: service_healthy
    # No bind mount here on purpose — Coolify builds from a fresh, ephemeral
    # per-deployment artifact directory (not a persistent checkout of this
    # repo), so bind-mounting `./backend` there shadows the image's baked-in
    # code (from the Dockerfile's `COPY . .` + composer/npm build) with an
    # empty directory, breaking `artisan`/`vendor`/built assets entirely (see
    # git history for the "Could not open input file: artisan" investigation).
    # Production always runs the code baked into the image; a code change
    # means a new image build + Coolify's own blue-green container swap,
    # gated by this service's healthcheck below. Local dev gets the bind
    # mount back via docker-compose.override.yml.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 25s
    # Not a host-port publish (that's what caused the blue-green collision
    # fixed earlier) — `expose:` only documents this container's listening
    # port to Docker/Compose and to Coolify's own compose parser, which uses
    # it (or a `:<port>` suffix on SERVICE_FQDN_BACKEND) to know which
    # container port Traefik should target. Without either, Coolify assumes
    # port 80 and the public domain times out even though the app is healthy.
    expose:
      - "8000"
    # Confirmed via live server debugging: Traefik runs with
    # --providers.docker.exposedbydefault=false and this image EXPOSEs three
    # ports (8000/8080/2019, shared across backend/queue/scheduler/reverb),
    # so it can't auto-detect a single target port. Coolify's own
    # auto-generated router labels turned out to be unreliable/unverifiable
    # (two rounds of labels matching its naming convention didn't fix
    # routing), so this defines a complete, self-contained Traefik
    # router+service here instead — independent of whatever Coolify's own
    # dashboard/label generation is doing. `coolify` is the network Traefik's
    # own container is always attached to (confirmed via `docker top
    # coolify-proxy`), so pin to it explicitly rather than relying on
    # whichever of this container's other networks Traefik might guess.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.backend-http.rule=Host(`x11oqof2fbwxdq26ev780h1c.187.77.134.143.sslip.io`)"
      - "traefik.http.routers.backend-http.entrypoints=http"
      - "traefik.http.routers.backend-http.middlewares=backend-redirect-https"
      - "traefik.http.middlewares.backend-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.routers.backend-https.rule=Host(`x11oqof2fbwxdq26ev780h1c.187.77.134.143.sslip.io`)"
      - "traefik.http.routers.backend-https.entrypoints=https"
      - "traefik.http.routers.backend-https.tls=true"
      - "traefik.http.routers.backend-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend-svc.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend-http.service=backend-svc"
      - "traefik.http.routers.backend-https.service=backend-svc"
    networks:
      - default
      - coolify

  # Runs App\Jobs\RunReplenishmentJob (QUEUE_CONNECTION=database) — without
  # this nothing ever processes the queued solver runs.
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # See the `backend` service's comment — shares the same built image.
    image: laravel-drs-backend:latest
    container_name: disasterresource-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --backoff=15 --timeout=620
    env_file:
      - .env
    # No bind mount here — see the `backend` service's comment above, same reasoning.
    stop_grace_period: 90s
    healthcheck:
      # Disables the base FrankenPHP image's default HEALTHCHECK, which
      # probes FrankenPHP's own admin API — not applicable here since this
      # service runs `php artisan queue:work`, not the FrankenPHP/Caddy server.
      disable: true
    networks:
      - default
      - coolify

  # Runs the Laravel scheduler (routes/console.php): the nightly "check
  # records" (`stock:verify`) that catches a directly edited stock row.
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # See the `backend` service's comment — shares the same built image.
    image: laravel-drs-backend:latest
    container_name: disasterresource-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env
    # No bind mount here — see the `backend` service's comment above, same reasoning.
    stop_grace_period: 90s
    healthcheck:
      # See the `queue` service's comment — same reasoning applies here.
      disable: true
    networks:
      - default
      - coolify

  # Websocket server for App\Events\ReplenishmentRunUpdated (routes/channels.php).
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # See the `backend` service's comment — shares the same built image.
    image: laravel-drs-backend:latest
    container_name: disasterresource-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file:
      - .env
    # No bind mount here — see the `backend` service's comment above, same reasoning.
    healthcheck:
      # See the `queue` service's comment — same reasoning applies here.
      disable: true
    # See the `backend` service's comment — same reasoning, so Coolify's
    # Traefik knows to target this container's 8080 instead of assuming 80.
    expose:
      - "8080"
    # See the `backend` service's comment — same self-contained Traefik
    # router+service approach, using the domain from .env.production's
    # SERVICE_URL_REVERB / VITE_REVERB_HOST.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.reverb-http.rule=Host(`reverb-x11oqof2fbwxdq26ev780h1c.187.77.134.143.sslip.io`)"
      - "traefik.http.routers.reverb-http.entrypoints=http"
      - "traefik.http.routers.reverb-http.middlewares=reverb-redirect-https"
      - "traefik.http.middlewares.reverb-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.routers.reverb-https.rule=Host(`reverb-x11oqof2fbwxdq26ev780h1c.187.77.134.143.sslip.io`)"
      - "traefik.http.routers.reverb-https.entrypoints=https"
      - "traefik.http.routers.reverb-https.tls=true"
      - "traefik.http.routers.reverb-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.reverb-svc.loadbalancer.server.port=8080"
      - "traefik.http.routers.reverb-http.service=reverb-svc"
      - "traefik.http.routers.reverb-https.service=reverb-svc"
    networks:
      - default
      - coolify

  # No `ports:` here either — see the `postgres` comment above, same reasoning.
  solver-service:
    build:
      context: ./solver-service
      dockerfile: Dockerfile
    container_name: disasterresource-solver
    restart: unless-stopped
    # No bind mount here — same reasoning as the `backend` service's comment
    # above: production runs the image's baked-in code (Dockerfile's
    # `COPY . .`), not a bind-mounted ephemeral artifact path.
    healthcheck:
      # The slim Python image has no curl; urllib raises (exit 1) on a failed or non-2xx response.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - default
      - coolify

# Coolify's shared network — needed to resolve other Coolify-managed
# resources by container hostname (e.g. the standalone PostgreSQL resource
# `.env.production`'s DB_HOST points at) and for Coolify's Traefik instance
# to route to `backend`/`reverb`, which publish no host ports of their own.
# `external: true` because Coolify owns/creates this network, not this
# compose project. Local dev neutralizes this in docker-compose.override.yml
# (external: false) so it doesn't require a pre-existing `coolify` network.
networks:
  coolify:
    external: true

